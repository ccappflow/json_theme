name: "json_theme_codegen"
description: "A library to generate the mapping of decoders to the class names they decode"
homepage: "https://github.com/peiffer-innovations/json_theme"
version: "1.1.3+7"

environment:
  sdk: ">=3.0.0 <4.0.0"

analyzer:
  exclude:
    - "lib/generated/**"
    - "lib/**/*.g.dart"

dependencies:
  analyzer: any
  build: any
  build_runner: any
  code_builder: any
  json_theme_annotation: any
  recase: any
  source_gen: any

dev_dependencies:
  flutter_lints: any
  test: any

dependency_overrides:
  json_theme_annotation:
    path: "../annotation"

permittedLicenses:
  - "Apache-2.0"
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "MIT"
  - "MIT-Modern-Variant"
  - "MPL-2.0"
  - "Zlib"

packageLicenseOverride:
  flutter: "BSD-3-Clause"
  flutter_driver: "BSD-3-Clause"
  flutter_goldens: "BSD-3-Clause"
  flutter_localizations: "BSD-3-Clause"
  flutter_web_plugins: "BSD-3-Clause"
  flutter_test: "BSD-3-Clause"
  fuchsia_remote_debug_protocol: "BSD-3-Clause"
  integration_test: "BSD-3-Clause"
  rxdart: "Apache-2.0"

ignore_updates:
  - "analyzer"
  - "archive"
  - "async"
  - "boolean_selector"
  - "characters"
  - "charcode"
  - "collection"
  - "clock"
  - "crypto"
  - "fake_async"
  - "file"
  - "matcher"
  - "material_color_utilities"
  - "meta"
  - "path"
  - "source_span"
  - "stack_trace"
  - "stream_channel"
  - "string_scanner"
  - "sync_http"
  - "term_glyph"
  - "test"
  - "test_api"
  - "typed_data"
  - "vector_math"
  - "webdriver"
